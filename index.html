<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jyothsna | Portfolio</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Internal CSS -->
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 70px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .navbar ul {
            list-style: none;
            display: flex;
        }

        .navbar ul li {
            margin: 0 15px;
        }

        .navbar ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            transition: 0.3s;
        }

        .navbar ul li a:hover {
            color: #ff6600;
        }

        /* Main Hero Section */
        .main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 80px 50px;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
        }

        .content h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .cta-btn a {
            display: inline-block;
            padding: 12px 25px;
            margin-right: 15px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background-color: #ff6600;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #e65500;
        }

        .btn-secondary {
            background-color: transparent;
            color: #333;
            border: 2px solid #333;
        }

        .btn-secondary:hover {
            background-color: #333;
            color: #fff;
        }

        /* Profile Photo */
        .photo img {
            height: 150px;
            width: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main {
                flex-direction: column;
                text-align: center;
                padding: 50px 20px;
            }

            .photo {
                margin-top: 30px;
            }
        }
    </style>
</head>
<body> 
    <!-- Header -->
    <header class="header">
        <a href="Home.html" class="logo">
            <img src="Durga.jpeg" alt="Jyothsna Logo" class="circle-img">
        </a>
        <div class="navbar">
            <nav>
                <ul>
                    <li><a href="Home.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="skills.html">SKILLS</a></li>
                    <li><a href="contact.html">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="main">
        <div class="content">
            <h1>Hi, I'm <br> JYOTHSNA NAGA DURGA</h1>
            <div class="cta-btn">
                <a href="Resume1.pdf" class="btn-primary" target="_blank">
                    <i class="fas fa-download"></i> Download Resume
                </a>
                <a href="contact.html" class="btn-secondary">
                    <i class="fas fa-envelope"></i> Contact Me
                </a>
            </div>
        </div>

        <div class="photo">
            <img src="Durga.jpeg" alt="Jyothsna Photo">
        </div>   
    </div>
</body>
</html>
